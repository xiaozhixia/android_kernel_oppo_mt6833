name: Build Kernel Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Patch Kernel Config (Remove Broken Dependency)
      run: |
        # 使用 sed 命令注释掉 init/Kconfig 中引用缺失文件的那一行
        sed -i '710s/^/# /' init/Kconfig
        echo "已注释掉 init/Kconfig 第710行"

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev flex bison libssl-dev libelf-dev bc

    - name: Configure kernel
      run: |
        make ARCH=arm64 O=out oppo6833_64_defconfig

    - name: Build modules
      run: |
        make ARCH=arm64 O=out -j$(nproc) modules

    - name: Upload modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: out/**/*.ko
